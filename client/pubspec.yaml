name: jizhang_client
description: Shared expenses, receipts, and settlements for Jizhang.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Material's adaptive Apple-platform controls also require this icon font.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^16.2.4
  file_selector: ^1.1.0
  web: 1.1.1
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - web/jizhang-mark.svg
    - assets/legal/mit.txt
