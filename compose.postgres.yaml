services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for bundled PostgreSQL}
      APP_DB_USER: ${PGUSER:-jizhang}
      APP_DB_NAME: ${PGDATABASE:-jizhang}
      APP_DB_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD for the application role}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-jizhang.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$APP_DB_USER" -d "$$APP_DB_NAME"']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  postgres-data:
