services:
  backend:
    image: ${JIZHANG_BACKEND_IMAGE:-jizhang-backend:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      BIND_HOST: "*6"
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-jizhang}
      PGUSER: ${PGUSER:-jizhang}
      PGPASSWORD: ${PGPASSWORD:-}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-/etc/ssl/certs/ca-certificates.crt}
      PGCONNECT_TIMEOUT: ${PGCONNECT_TIMEOUT:-10}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      OIDC_SECRET_KEY: ${OIDC_SECRET_KEY:?Set OIDC_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-}
      AUTH_CONFIG_SOURCE: ${AUTH_CONFIG_SOURCE-database}
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      LOCAL_REGISTRATION_ENABLED: ${LOCAL_REGISTRATION_ENABLED:-}
      SSO_REGISTRATION_ENABLED: ${SSO_REGISTRATION_ENABLED:-}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE-600}
      RATE_LIMIT_AUTH_PER_IP_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_IP_PER_MINUTE-20}
      RATE_LIMIT_ACCOUNT_PER_MINUTE: ${RATE_LIMIT_ACCOUNT_PER_MINUTE-300}
      RATE_LIMIT_EXPENSIVE_PER_ACCOUNT_PER_MINUTE: ${RATE_LIMIT_EXPENSIVE_PER_ACCOUNT_PER_MINUTE-30}
      RATE_LIMIT_CREDENTIAL_PER_MINUTE: ${RATE_LIMIT_CREDENTIAL_PER_MINUTE-10}
      REQUEST_AUTH_BODY_MAX_BYTES: ${REQUEST_AUTH_BODY_MAX_BYTES-65536}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES-1048576}
      REQUEST_BULK_BODY_MAX_BYTES: ${REQUEST_BULK_BODY_MAX_BYTES-8388608}
      REQUEST_MAX_IN_FLIGHT: ${REQUEST_MAX_IN_FLIGHT-32}
      REQUEST_MAX_EXPENSIVE_IN_FLIGHT: ${REQUEST_MAX_EXPENSIVE_IN_FLIGHT-4}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS-10000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS-}

  web:
    image: ${JIZHANG_WEB_IMAGE:-jizhang-web:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /public/runtime:uid=1000,gid=1000,mode=0700
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    environment:
      API_BASE_URL: ${API_BASE_URL-${PUBLIC_API_URL:?Set PUBLIC_API_URL}}
