<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jizhang Admin</title>
  <link rel="stylesheet" href="/admin-ui/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/admin-ui/jizhang-mark.svg">
  <script src="/admin-ui/money.js" defer></script>
  <script src="/admin-ui/statistics.js" defer></script>
  <script src="/admin-ui/app.js" defer></script>
</head>
<body>
  <div id="app">
    <section id="login-view" class="screen">
      <div class="card auth-card">
        <div class="brand-heading">
          <img src="/admin-ui/jizhang-mark.svg" width="48" height="48" alt="" aria-hidden="true">
          <h1>Jizhang Admin</h1>
        </div>
        <p class="muted app-version">v__JIZHANG_VERSION__</p>
        <p class="muted">Sign in with an admin account.</p>
        <form id="login-form" class="stack" method="post" action="/admin/auth/session/login">
          <label><span>Username</span><input name="username" autocomplete="username" required maxlength="50" /></label>
          <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="primary">Sign in</button>
        </form>
        <p id="login-error" class="error" role="alert"></p>
        <button id="session-retry" type="button" class="secondary hidden">Retry session check</button>
        <button id="logout-retry" type="button" class="secondary hidden">Retry sign-out</button>
        <nav class="license-links" aria-label="Software notices">
          <a href="/legal/licenses" target="_blank" rel="noopener noreferrer" aria-label="Open-source licenses (opens in a new tab)">Open-source licenses</a>
        </nav>
      </div>
    </section>
    <section id="dashboard-view" class="screen hidden">
      <aside class="sidebar">
        <div>
          <div class="brand-heading">
            <img src="/admin-ui/jizhang-mark.svg" width="32" height="32" alt="" aria-hidden="true">
            <h2>Jizhang Admin</h2>
          </div>
          <p class="muted app-version">v__JIZHANG_VERSION__</p>
          <p id="admin-identity" class="muted"></p>
        </div>
        <nav class="nav" aria-label="Main navigation">
          <a href="#/overview">Overview</a><a href="#/users">Users</a><a href="#/authentication">Authentication</a><a href="#/admins">Admins</a><a href="#/groups">Groups</a>
        </nav>
        <nav class="license-links" aria-label="Software notices">
          <a href="/legal/licenses" target="_blank" rel="noopener noreferrer" aria-label="Open-source licenses (opens in a new tab)">Open-source licenses</a>
        </nav>
        <button id="logout-btn" type="button" class="secondary">Log out</button>
      </aside>
      <main id="main-content" class="content" tabindex="-1">
        <p id="success-status" class="success" role="status" aria-live="polite"></p>
        <p id="page-error" class="error" role="alert"></p>
        <section id="page" class="stack" aria-live="polite"></section>
      </main>
    </section>
  </div>
  <dialog id="editor-dialog" aria-labelledby="editor-title">
    <form id="editor-form" class="stack">
      <header class="dialog-header"><h2 id="editor-title"></h2><button id="editor-close" type="button" class="ghost" aria-label="Close editor">Close</button></header>
      <div id="editor-body" class="dialog-body stack"></div>
      <footer class="dialog-actions"><p id="editor-error" class="error" role="alert"></p><button id="editor-cancel" type="button" class="secondary">Cancel</button><button id="editor-save" type="submit" class="primary">Save</button></footer>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="dialog-header"><h2 id="confirm-title"></h2></div>
    <div class="dialog-body"><p id="confirm-message"></p><p id="confirm-error" class="error" role="alert"></p></div>
    <div class="dialog-actions"><button id="confirm-cancel" type="button" class="secondary">Cancel</button><button id="confirm-accept" type="button" class="danger">Confirm</button></div>
  </dialog>
  <dialog id="invitation-dialog" aria-labelledby="invitation-title">
    <div class="dialog-header"><h2 id="invitation-title">One-time invitation</h2></div>
    <div id="invitation-body" class="dialog-body stack"></div>
    <div class="dialog-actions"><button id="invitation-close" type="button" class="secondary">Close</button></div>
  </dialog>
</body>
</html>
